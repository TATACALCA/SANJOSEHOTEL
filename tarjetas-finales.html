<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#DDD8CF; color:#1C1A18; }

.masthead { background:#3A4A22; padding:56px; text-align:center; }
.ey  { font-size:9px; letter-spacing:5px; text-transform:uppercase; color:rgba(232,224,200,.35); margin-bottom:14px; }
.mh1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:30px; letter-spacing:5px; color:#E8E0C8; }

.sn { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:rgba(28,26,24,.24); }

.cu { display:flex; flex-direction:column; align-items:center; gap:9px; }

.cn { font-size:8px; letter-spacing:1px; color:rgba(28,26,24,.2); }

/* 85x55mm @ 4px/mm */
.card {
  width:340px; height:220px; border-radius:6px;
  position:relative; overflow:hidden; flex-shrink:0;

.notes { max-width:270px; padding-top:8px; display:flex; flex-direction:column; gap:14px; }
.note h5 { font-size:8px; letter-spacing:3px; text-transform:uppercase; color:rgba(28,26,24,.28); margin-bottom:3px; }
.note p  { font-size:11.5px; color:rgba(28,26,24,.5); line-height:1.7; }

<!-- ══ EXPORT SCRIPT ══ -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  #export-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #2A3818; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.3); z-index: 9999;
    font-family: 'Inter', sans-serif;
  }
  #export-bar span {
    color: #C8C0A8; font-size: 13px; font-weight: 300; letter-spacing: 1px;
  }
  .exp-btn {
    background: #3A4A22; color: #F6F2EA;
    border: 0.5px solid #C8C0A8; padding: 9px 22px;
    font-family: 'Inter', sans-serif; font-size: 11px;
    font-weight: 300; letter-spacing: 2px; cursor: pointer;
    text-transform: uppercase; transition: background 0.2s;
  }
  .exp-btn:hover { background: #4A5A2E; }
  #export-status { color: #9AA882; font-size: 12px; }
</style>

<div id="export-bar">
  <span>— EXPORTAR TARJETAS —</span>
  <button class="exp-btn" onclick="exportCards()">Descargar JPGs</button>
  <button class="exp-btn" onclick="exportCardsHD()">Descargar JPGs ×2</button>
  <span id="export-status"></span>
</div>

<script>
async function captureCard(el, filename, scale) {
  const status = document.getElementById('export-status');
  status.textContent = 'Capturando ' + filename + '…';
  const canvas = await html2canvas(el, {
    scale: scale,
    useCORS: true,
    allowTaint: true,
    backgroundColor: null,
    logging: false,
    imageTimeout: 30000,
  });
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/jpeg', 0.95);
  link.click();
  await new Promise(r => setTimeout(r, 600));
}

async function runExport(scale) {
  const status = document.getElementById('export-status');
  const cards = document.querySelectorAll('.card');
  const names = [
    'tarjeta-1-frente.jpg',
    'tarjeta-1-reverso.jpg',
    'tarjeta-2-frente.jpg',
    'tarjeta-2-reverso.jpg',
  ];
  for (let i = 0; i < Math.min(cards.length, names.length); i++) {
    await captureCard(cards[i], names[i], scale);
  }
  status.textContent = '✓ ' + Math.min(cards.length, names.length) + ' archivos descargados';
}

function exportCards()   { runExport(3); }
function exportCardsHD() { runExport(4); }
</script>
